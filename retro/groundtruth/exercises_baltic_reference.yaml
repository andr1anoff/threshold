# Known incompleteness, stated rather than hidden:
#
#  * The list is dominated by NATO's announced programme. Russian and
#    Belarusian activity appears only where it was widely reported (Zapad
#    2025), so recall against Russian exercises is not measured here even
#    though they dominate the registry by article count.
#  * National exercises outside NATO umbrellas are under-represented.
#  * 2025 and 2026 entries lean on a secondary tracker rather than primary
#    announcements. Report recall separately by tier if the two diverge.
#  * 2023 is absent: official exercise lists for that year are less well
#    preserved, and a reference of uncertain provenance would weaken rather
#    than strengthen the measurement.
