# External recall reference: Baltic theatre, 2024-2026
#
# Compiled from published announcements, NOT from the pipeline. Measuring a
# registry against a list derived from its own inputs proves only that the code
# is self-consistent.
#
# SOURCE TIERS. Each entry carries `tier`, because a recall figure measured
# against a list of unknown reliability is not evidence:
#   official   NATO/SHAPE, a national defence ministry, or a national armed
#              forces press office
#   secondary  defence trade press or a specialist tracker; accurate in practice
#              but not a primary announcement
#
# SCOPE. In scope if activity took place in, or in the waters of, the countries
# present in the GDELT extract: LV LT EE FI SE NO PL RU BY. Germany, the UK,
# Romania, Bulgaria, Hungary and the Mediterranean are OUT, and are listed as
# such rather than silently dropped -- a recall figure has to say what it
# excluded.
#
# COVERAGE. 2026 runs only to 27 July, matching the end of the GDELT extract.
# Exercises announced for later in 2026 are excluded; counting them as misses
# would penalise the registry for data it was never given.

sources:
  - name: SHAPE, Steadfast Defender 2024 exercise list
    url: https://shape.nato.int/stde24/newsroom/exercise-list.aspx
    tier: official
  - name: US Navy via GlobalSecurity, BALTOPS 2024 announcement
    url: https://www.globalsecurity.org/military/library/news/2024/05/mil-240531-usn01.htm
    tier: official
  - name: Canadian Department of National Defence, STDE24 wrap-up
    url: https://www.canada.ca/en/department-national-defence/news/2024/05/canada-wraps-up-participation-in-natos-exercise-steadfast-defender-2024.html
    tier: official
  - name: Joint Forces News, Steadfast Dart 25 factsheet (SHAPE press release)
    url: https://www.joint-forces.com/exercise-news/78965-steadfast-dart-stdt25-factsheet
    tier: official
  - name: Bundeswehr, Steadfast Dart 2026
    url: https://www.bundeswehr.de/en/mission-and-tasks/exercises/steadfast-dart-2026
    tier: official
  - name: Grosswald, NATO Exercises 2025 and 2026 trackers
    url: https://www.grosswald.org/nato-exercises-2026/
    tier: secondary

